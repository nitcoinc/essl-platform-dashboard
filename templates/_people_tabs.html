{# Sub-tabs under People. nav_issue_count = actionable ID issues (set for HR and admin).
   ID issues is current on its page and on the Archived punches list (KTD7). #}
<nav class="subtabs" aria-label="People sections">
  <a class="subtab" href="{{ url_for('people.people_view') }}"{% if request.endpoint == 'people.people_view' %} aria-current="page"{% endif %}>Directory</a>
  <a class="subtab" href="{{ url_for('people.id_issues_view') }}"{% if active_section == 'id_issues' %} aria-current="page"{% endif %}>ID issues{% if nav_issue_count %} <span class="subtab-count" aria-label="{{ nav_issue_count }} to check">{{ nav_issue_count }}</span>{% endif %}</a>
  <a class="subtab" href="{{ url_for('people.people_archive_view') }}"{% if request.endpoint == 'people.people_archive_view' %} aria-current="page"{% endif %}>Archive</a>
</nav>
